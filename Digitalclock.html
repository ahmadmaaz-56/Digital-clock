<!DOCTYPE html>
<html lang="en">
<head>
    <!--Meta tags-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <!--Css link tag-->
    <link rel="stylesheet" href="Digitalclock.css">
</head>
<body>
    <div class="hero">
        <div class="container">
            <div class="clock">
               <span id="hrs">00</span>
               <span>:</span>
               <span id="min">00</span>
               <span>:</span>
               <span id="sec">00</span>
            </div>
        </div>
    </div>
    
    <!--Js tag-->
    <script src="Digitalclock.js"></script>
</body>
</html>
